<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Sigma Kingdoms</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101820;
    font-family: Arial, sans-serif;
    color: white;
}

#game {
    position: fixed;
    inset: 0;
}

#ui {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 10;
    pointer-events: none;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.logo {
    background: rgba(10,16,23,.88);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 18px;
    font-weight: 800;
    box-shadow: 0 5px 20px rgba(0,0,0,.3);
}

.money {
    background: rgba(10,16,23,.88);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 14px;
    padding: 10px 14px;
    font-weight: bold;
}

#buildPanel {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    z-index: 20;

    display: flex;
    gap: 8px;

    max-width: calc(100% - 20px);
    overflow-x: auto;

    padding: 10px;

    background: rgba(10,16,23,.92);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.buildButton {
    flex: 0 0 auto;
    min-width: 76px;
    min-height: 68px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 13px;

    background: #1b2730;
    color: white;

    font-size: 12px;
    font-weight: bold;

    padding: 8px;
}

.buildButton:active {
    transform: scale(.96);
}

.buildButton.active {
    outline: 2px solid #ffffff;
    background: #304351;
}

.icon {
    display: block;
    font-size: 27px;
    margin-bottom: 3px;
}

#message {
    position: fixed;
    left: 50%;
    top: 80px;
    transform: translateX(-50%);

    z-index: 30;

    padding: 9px 15px;

    border-radius: 12px;
    background: rgba(10,16,23,.9);

    font-size: 13px;
    opacity: 0;

    transition: opacity .2s;
    pointer-events: none;
}

#hint {
    position: fixed;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);

    z-index: 10;

    width: max-content;
    max-width: calc(100% - 30px);

    padding: 8px 13px;

    background: rgba(10,16,23,.72);
    border-radius: 12px;

    font-size: 12px;
    color: #d7dde2;

    pointer-events: none;
}

@media (max-width: 600px) {

    .logo {
        font-size: 15px;
        padding: 8px 11px;
    }

    .money {
        font-size: 13px;
        padding: 8px 11px;
    }

    #hint {
        bottom: 105px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="ui">
    <div class="topbar">
        <div class="logo">🏰 SIGMA KINGDOMS</div>
        <div class="money">💰 <span id="money">10000</span></div>
    </div>
</div>

<div id="message"></div>

<div id="hint">
    Выбери объект снизу и нажми на землю
</div>

<div id="buildPanel">

    <button class="buildButton" data-type="house1">
        <span class="icon">🏠</span>
        Дом
    </button>

    <button class="buildButton" data-type="house2">
        <span class="icon">🏡</span>
        Большой дом
    </button>

    <button class="buildButton" data-type="farm">
        <span class="icon">🌾</span>
        Ферма
    </button>

    <button class="buildButton" data-type="woodwall">
        <span class="icon">🪵</span>
        Стена
    </button>

    <button class="buildButton" data-type="stonewall">
        <span class="icon">🧱</span>
        Каменная стена
    </button>

    <button class="buildButton" data-type="road">
        <span class="icon">🛤️</span>
        Дорога
    </button>

    <button class="buildButton" data-type="tree">
        <span class="icon">🌳</span>
        Дерево
    </button>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* =========================
   ОСНОВНЫЕ ПЕРЕМЕННЫЕ
========================= */

const container = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87a9b5);

const camera = new THREE.PerspectiveCamera(
    50,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(24, 22, 28);


const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

container.appendChild(renderer.domElement);


/* =========================
   КАМЕРА
========================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.minDistance = 8;
controls.maxDistance = 70;

controls.maxPolarAngle = Math.PI / 2.05;

controls.target.set(0, 0, 0);


/* =========================
   СВЕТ
========================= */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x405040,
    2.2
);

scene.add(ambient);


const sun = new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(20, 35, 15);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;

scene.add(sun);


/* =========================
   МИР
========================= */

const world = new THREE.Group();

scene.add(world);


/* =========================
   ЗЕМЛЯ
========================= */

const groundGeometry =
    new THREE.PlaneGeometry(100, 100);

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x52794a,
        roughness: 1
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

world.add(ground);


/* =========================
   ВОДА
========================= */

const waterGeometry =
    new THREE.PlaneGeometry(100, 10);

const waterMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x397b96,
        roughness: .4,
        metalness: .1
    });

const water =
    new THREE.Mesh(
        waterGeometry,
        waterMaterial
    );

water.rotation.x = -Math.PI / 2;

water.position.set(0, .03, -45);

world.add(water);


/* =========================
   ДОРОГА
========================= */

function createRoad(
    x,
    z,
    type = "dirt",
    width = 3,
    length = 15,
    rotation = 0
) {

    let color = 0x8c6b4a;

    if (type === "stone") {
        color = 0x8c9090;
    }

    if (type === "brick") {
        color = 0x9c4e39;
    }

    const geometry =
        new THREE.BoxGeometry(
            width,
            .08,
            length
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: 1
        });

    const road =
        new THREE.Mesh(
            geometry,
            material
        );

    road.position.set(
        x,
        .06,
        z
    );

    road.rotation.y = rotation;

    road.receiveShadow = true;

    world.add(road);

    return road;
}


/* Главная дорога */

createRoad(
    0,
    5,
    "stone",
    4,
    40
);


/* Боковые дороги */

createRoad(
    -15,
    0,
    "dirt",
    3,
    25,
    Math.PI / 2
);

createRoad(
    15,
    0,
    "brick",
    3,
    25,
    Math.PI / 2
);


/* =========================
   КУСТ
========================= */

function createBush(x, z) {

    const group = new THREE.Group();

    const geometry =
        new THREE.SphereGeometry(
            .7,
            8,
            8
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x315b35
        });

    const bush =
        new THREE.Mesh(
            geometry,
            material
        );

    bush.position.y = .6;

    bush.scale.y = .7;

    bush.castShadow = true;

    group.add(bush);

    group.position.set(x, 0, z);

    world.add(group);
}


/* =========================
   ДЕРЕВО
========================= */

function createTree(x, z) {

    const group = new THREE.Group();


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .18,
                .25,
                1.5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x6d4328
            })
        );

    trunk.position.y = .75;

    trunk.castShadow = true;

    group.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                1.15,
                2.8,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x285c32
            })
        );

    leaves.position.y = 2.35;

    leaves.castShadow = true;

    group.add(leaves);


    group.position.set(x, 0, z);

    world.add(group);

    return group;
}


/* Лес */

[
    [-30,-25],
    [-25,-30],
    [-20,-27],
    [25,-28],
    [30,-20],
    [-32,20],
    [30,25],
    [25,30],
    [-28,28]
].forEach(p => createTree(p[0], p[1]));


/* =========================
   ЗАМОК
========================= */

function createCastle(x = 0, z = -5) {

    const castle =
        new THREE.Group();


    /* Главный корпус */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                8,
                5,
                7
            ),
            new THREE.MeshStandardMaterial({
                color: 0xaaa59a,
                roughness: .9
            })
        );

    body.position.y = 2.5;

    body.castShadow = true;

    castle.add(body);


    /* Башни */

    const towerPositions = [
        [-4, -3.5],
        [4, -3.5],
        [-4, 3.5],
        [4, 3.5]
    ];


    towerPositions.forEach(pos => {

        const tower =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    1.35,
                    1.45,
                    7,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color: 0xb8b2a7
                })
            );

        tower.position.set(
            pos[0],
            3.5,
            pos[1]
        );

        tower.castShadow = true;

        castle.add(tower);


        /* Крыша */

        const roof =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    1.65,
                    2.4,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x263b63
                })
            );

        roof.position.set(
            pos[0],
            8.2,
            pos[1]
        );

        roof.castShadow = true;

        castle.add(roof);
    });


    /* Центральная башня */

    const mainTower =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.2,
                8,
                3.2
            ),
            new THREE.MeshStandardMaterial({
                color: 0xc1bbb0
            })
        );

    mainTower.position.y = 4;

    mainTower.castShadow = true;

    castle.add(mainTower);


    const mainRoof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                2.3,
                3,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x263b63
            })
        );

    mainRoof.position.y = 9.5;

    mainRoof.castShadow = true;

    castle.add(mainRoof);


    /* Ворота */

    const gate =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2,
                2.8,
                .3
            ),
            new THREE.MeshStandardMaterial({
                color: 0x4a2d1b
            })
        );

    gate.position.set(
        0,
        1.4,
        -3.6
    );

    castle.add(gate);


    castle.position.set(
        x,
        0,
        z
    );

    world.add(castle);

    return castle;
}


createCastle();


/* =========================
   ДОМ
========================= */

function createHouse(
    x,
    z,
    large = false
) {

    const group =
        new THREE.Group();

    const size =
        large ? 3.4 : 2.7;

    const height =
        large ? 2.5 : 2;


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                size,
                height,
                size
            ),
            new THREE.MeshStandardMaterial({
                color: large
                    ? 0xc5a77d
                    : 0xb8875c
            })
        );

    body.position.y =
        height / 2;

    body.castShadow = true;

    group.add(body);


    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                size * .75,
                1.7,
                4
            ),
            new THREE.MeshStandardMaterial({
                color: large
                    ? 0x713b32
                    : 0x5b3828
            })
        );

    roof.rotation.y =
        Math.PI / 4;

    roof.position.y =
        height + .75;

    roof.castShadow = true;

    group.add(roof);


    group.position.set(
        x,
        0,
        z
    );

    world.add(group);

    return group;
}


/* =========================
   ФЕРМА
========================= */

function createFarm(x, z) {

    const group =
        new THREE.Group();


    const field =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5,
                .08,
                4
            ),
            new THREE.MeshStandardMaterial({
                color: 0xa9783e
            })
        );

    field.position.y = .05;

    field.receiveShadow = true;

    group.add(field);


    for (let i = -1.5; i <= 1.5; i += .7) {

        const crop =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .15,
                    .7,
                    3.5
                ),
                new THREE.MeshStandardMaterial({
                    color: 0xc7a53c
                })
            );

        crop.position.set(
            i,
            .4,
            0
        );

        group.add(crop);
    }


    group.position.set(
        x,
        0,
        z
    );

    world.add(group);

    return group;
}


/* =========================
   СТЕНА
========================= */

function createWall(
    x,
    z,
    stone = false,
    rotation = 0
) {

    const group =
        new THREE.Group();


    const material =
        new THREE.MeshStandardMaterial({
            color: stone
                ? 0x858585
                : 0x74482b
        });


    const wall =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4,
                stone ? 2.5 : 2,
                .5
            ),
            material
        );

    wall.position.y =
        stone ? 1.25 : 1;

    wall.castShadow = true;

    group.add(wall);


    if (!stone) {

        for (
            let i = -1.5;
            i <= 1.5;
            i += .75
        ) {

            const post =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .15,
                        2.5,
                        .7
                    ),
                    material
                );

            post.position.set(
                i,
                1.25,
                0
            );

            post.castShadow = true;

            group.add(post);
        }
    }


    group.position.set(
        x,
        0,
        z
    );

    group.rotation.y = rotation;

    world.add(group);

    return group;
}


/* =========================
   НАЧАЛЬНЫЙ ГОРОД
========================= */

createHouse(-8, 5);
createHouse(8, 5, true);

createFarm(-10, 13);

createWall(
    -8,
    -10,
    true,
    0
);

createWall(
    -4,
    -10,
    true,
    0
);

createWall(
    4,
    -10,
    true,
    0
);

createWall(
    8,
    -10,
    true,
    0
);


/* =========================
   КУСТЫ
========================= */

[
    [-14,8],
    [-18,5],
    [14,8],
    [18,3],
    [17,15],
    [-17,16]
].forEach(p => createBush(p[0],p[1]));


/* =========================
   СТРОИТЕЛЬСТВО
========================= */

let selectedType = null;

const buttons =
    document.querySelectorAll(".buildButton");


buttons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            buttons.forEach(b =>
                b.classList.remove("active")
            );

            button.classList.add("active");

            selectedType =
                button.dataset.type;

            showMessage(
                "Теперь нажми на землю"
            );
        }
    );
});


/* =========================
   КЛИК ПО ЗЕМЛЕ
========================= */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        if (!selectedType) return;


        const rect =
            renderer.domElement
            .getBoundingClientRect();


        mouse.x =
            ((event.clientX - rect.left)
            / rect.width) * 2 - 1;

        mouse.y =
            -((event.clientY - rect.top)
            / rect.height) * 2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const hits =
            raycaster.intersectObject(
                ground
            );


        if (!hits.length) return;


        const point =
            hits[0].point;


        buildObject(
            selectedType,
            point.x,
            point.z
        );
    }
);


/* =========================
   СОЗДАНИЕ ОБЪЕКТА
========================= */

function buildObject(
    type,
    x,
    z
) {

    if (type === "house1") {
        createHouse(x,z,false);
    }

    if (type === "house2") {
        createHouse(x,z,true);
    }

    if (type === "farm") {
        createFarm(x,z);
    }

    if (type === "woodwall") {
        createWall(
            x,
            z,
            false,
            0
        );
    }

    if (type === "stonewall") {
        createWall(
            x,
            z,
            true,
            0
        );
    }

    if (type === "road") {
        createRoad(
            x,
            z,
            "brick",
            3,
            7
        );
    }

    if (type === "tree") {
        createTree(x,z);
    }


    showMessage(
        "Построено!"
    );

    saveGame();
}


/* =========================
   СООБЩЕНИЯ
========================= */

let messageTimer = null;

function showMessage(text) {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.style.opacity = "1";


    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(() => {

            box.style.opacity = "0";

        }, 1200);
}


/* =========================
   СОХРАНЕНИЕ
========================= */

function saveGame() {

    /*
       Первая версия сохраняет
       факт существования игры.

       Полную систему координат
       объектов добавим следующим
       этапом.
    */

    localStorage.setItem(
        "sigmaKingdomsStarted",
        "true"
    );
}


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
